# .pre-commit-config.yaml
# Install:  pip install pre-commit && pre-commit install
# Run all:  pre-commit run --all-files
# Update:   pre-commit autoupdate  (run quarterly; keep clang-format in sync with your LLVM toolchain version)

repos:
  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files

  # Spell checking — catches typos in identifiers, comments, and strings before they propagate
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        args: [--skip, "*.json,*.lock"]

  # clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # clang-tidy (local hook — needs your build's compile_commands.json)
  # Note: clang-analyzer-* checks are 3-5x slower; consider running tidy without them locally
  # and enabling the full config only in CI.
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build --config-file=.clang-tidy --quiet
        language: system
        types_or: [c, c++]
        require_serial: true

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--severity=warning]

  # CMake formatting and linting (remove if not using CMake)
  - repo: https://github.com/cheshirekow/cmake-format-precommit
    rev: v0.6.13
    hooks:
      - id: cmake-format
        types: [cmake]
      - id: cmake-lint
        types: [cmake]

  # ruff formatter (analogous to clang-format)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff-format
        args: [--config, python/ruff.toml]
        types_or: [python, pyi]

  # ruff linter (analogous to clang-tidy)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--config, python/ruff.toml, --fix]
        types_or: [python, pyi]

  # mypy (static type checking)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--config-file, python/mypy.ini]
        types_or: [python, pyi]
