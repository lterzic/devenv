# python/mypy.ini
# mypy: static type checker for Python
# Docs: https://mypy.readthedocs.io/en/stable/config_file.html

[mypy]
python_version = 3.11  # match ruff's target-version

# Meta-flag: enables all current strict checks + any future ones mypy adds automatically.
# The individual flags below are kept as documentation and to allow per-project overrides.
strict = True

# Require type annotations on all definitions
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

# Disallow implicit Any
disallow_any_generics = true
disallow_subclassing_any = true
warn_return_any = true

# Optional / None safety
no_implicit_optional = true
strict_optional = true

# Warn on likely mistakes
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
warn_no_return = true
warn_unreachable = true     # dead branches are a serious signal in safety-critical code

# API surface control — must use __all__ or `import X as X` to re-export
no_implicit_reexport = true

# Opt into preview-tier soundness checks (redundant casts, parameter specs)
extra_checks = true

# Imports — third-party stubs are often absent; suppress those errors
ignore_missing_imports = true
follow_imports = normal
